<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Cyber-B1t</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: black;
            color: white;
            text-align: center;
        }

        .btns {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .row {
            display: flex;
            justify-content: center;
            margin: 10px 0;
        }

        button {
            width: 80px;
            height: 80px;
            font-size: 30px;
            background-color: rgba(51, 47, 62, 0.9);
            border: none;
            color: white;
            border-radius: 10px;
            margin: 5px;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        button:active {
            transform: scale(1.1);
            background-color: rgba(51, 47, 62, 0.8);
        }

        .stop {
            background-color: rgba(152, 11, 11, 0.9);
            right:40px;
        }

        img#stream {
            transform: rotate(-90deg);
        }
        div#border {
            width: 360px;
            height: 210px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(51, 47, 62, 0.9);
        }
        #sideMenu {
            position: fixed;
            top: 0;
            right: -200px; /* Inicialmente fuera de la vista */
            width: 400px;
            height: 100%;
            background-color: rgba(51, 47, 62, 0.9);
            padding: 20px;
            box-shadow: -2px 0 5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease;
            transform: translateX(100%); /* Oculto */
            z-index: 999;
        }

        #sideMenu.open {
            transform: translateX(0); /* Menú visible */
        }

        #menuButton {
            position: fixed;
            top: 15px;
            right: 15px;
            background-color: rgba(51, 47, 62, 0.9);
            border: none;
            color: white;
            font-size: 20px;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
            z-index: 10;
            z-index: 1000;
        }

        #menuButton:active {
            transform: scale(1.1);
            background-color:rgba(51, 47, 62, 0.8);
        }

        .slider {
            width: 100px; /* Ajuste para dispositivos móviles */
            max-width: 100px;
            height: 30px;
            background-color: rgba(152, 11, 11, 0.9);
            -webkit-appearance: none;
            appearance: none;
            margin-top: 20px;
            border-radius: 15%;
            
        }
        .slider-c{
            margin-right: 100px;
            margin-top: 80px;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 30px;
            height: 30px;
            background-color: white;
            cursor: pointer;
            border-radius: 50%;
        }
        .Sh {
            position: relative;
            right:130px;
        }
        .F {
            position: relative;
            left:45px;
        }
        .slider::-moz-range-thumb {
            width: 30px;
            height: 30px;
            background-color: rgba(51, 47, 62, 0.6);
            cursor: pointer;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <button id="menuButton" onclick="toggleMenu()">☰ Menú</button>
    <div id="sideMenu" class="side-menu">
        <div class="slider-c">
            <h3>Brightness</h3>
            <input id="servoSlider" class="slider" type="range" min="0" max="255" value="0" oninput="TurnFlash(this.value)">
        </div>
    </div>
    <h1>Cyber-B1t Control Panel</h1>
    <div id="border">
        <img id="stream" width="200px" height="350px" alt="Streaming...">
    </div>
    <div class="btns"> 
        <div class="row">
            <button 
                onmousedown="SendToESP('F')" 
                onmouseup="SendToESP('S')"
                ontouchstart="SendToESP('F')" 
                ontouchend="SendToESP('S')"  
                class="F">▲</button>
            <button 
                onmousedown="SendToESP('Sh')" 
                onmouseup="SendToESP('S')" 
                ontouchstart="SendToESP('Sh')" 
                ontouchend="SendToESP('S')" 
                class="Sh">⚡</button>
        </div>
        <div class="row">
            <button 
                onmousedown="SendToESP('L')" 
                onmouseup="SendToESP('S')" 
                ontouchstart="SendToESP('L')" 
                ontouchend="SendToESP('S')" 
                class="L">◀</button>
            <button
                onmousedown="SendToESP('S')"
                ontouchstart="SendToESP('S')" 
                ontouchend="SendToESP('S')"  
                class="stop">■</button>
            <button 
                onmousedown="SendToESP('R')" 
                onmouseup="SendToESP('S')" 
                ontouchstart="SendToESP('R')" 
                ontouchend="SendToESP('S')" 
                class="R">▶</button>
        </div>
        <div class="row">
            <button 
                onmousedown="SendToESP('B')" 
                onmouseup="SendToESP('S')"
                ontouchstart="SendToESP('B')" 
                ontouchend="SendToESP('S')"  
                class="B">▼</button>
        </div>
    </div>
    <script>
        var connection = new WebSocket('ws://' + window.location.hostname + '/ws');
        const streamImage = document.getElementById("stream");
        const ws = new WebSocket(`ws://${location.hostname}/ws`);

        ws.binaryType = "arraybuffer";
        connection.onopen = function () {
            console.log('WebSocket conectado');
        };

        connection.onerror = function (error) {
            console.log('WebSocket Error ', error);
        };

        connection.onmessage = function (event) {
            console.log('Servidor dice: ' + event.data);
            const blob = new Blob([event.data], { type: 'image/jpeg' });
            streamImage.src = URL.createObjectURL(blob); 
        };

        function SendToESP(action) {
            if (connection.readyState === WebSocket.OPEN) {
                connection.send(action);
            } else {
                console.log('WebSocket no está conectado.');
            }
        }

        function TurnFlash(value) {
            SendToESP("Flash:" + value);
        }

        function toggleMenu() {
            const menu = document.getElementById("sideMenu");
            menu.classList.toggle("open");
        }
    </script>
</body>
</html>
